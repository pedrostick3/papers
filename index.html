<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F2A4D">
<title>Papers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<script src="firebase-config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
<style>
:root{
  --tinta:#1F2A4D; --tinta-funda:#151D38; --papel:#FFFBEF; --pauta:#BFD3F2; --margem:#F27A7A; --ok:#2EC4B6;
  --bg:#E6ECF8; --bg2:#D5DEF1; --text:#1F2A4D; --muted:#56628A; --card:#F7F9FE; --line:rgba(31,42,77,.14); --shadow:#1F2A4D;
  --paper-bg: linear-gradient(90deg, transparent 38px, rgba(242,122,122,.8) 38px, rgba(242,122,122,.8) 40px, transparent 40px), repeating-linear-gradient(180deg, transparent 0 33px, #BFD3F2 33px 34px), #FFFBEF;
  --paper-ink:#1F2A4D; --paper-pad:52px;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#1F2A4D; --bg2:#151D38; --text:#F3F1E8; --muted:#A9B3D1; --card:#283561; --line:rgba(255,255,255,.13); --shadow:#0C1126; color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#1F2A4D; --bg2:#151D38; --text:#F3F1E8; --muted:#A9B3D1; --card:#283561; --line:rgba(255,255,255,.13); --shadow:#0C1126; color-scheme:dark; }
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0; min-height:100%; background:var(--bg); color:var(--text);
  font-family:'Bricolage Grotesque', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  font-size:17px; line-height:1.45; -webkit-tap-highlight-color:transparent; overflow-x:hidden}
#app{max-width:520px; margin:0 auto; padding:16px 18px 96px; min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)); min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column}
body.lockon #app{padding-top:64px}
body.lockon.inturn #app{padding-top:16px}
h1,h2,h3{margin:0; line-height:1.05}
h2{font-size:30px; font-weight:800; letter-spacing:-.01em}
h3{font-size:20px; font-weight:800; margin-top:14px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px; color:var(--muted)}
:focus-visible{outline:3px solid #FFC145; outline-offset:2px}

/* botões */
.btn{font:inherit; font-weight:800; font-size:18px; min-height:56px; padding:14px 20px; border-radius:14px;
  border:2px solid var(--tinta); background:var(--papel); color:var(--tinta); box-shadow:0 4px 0 var(--shadow);
  cursor:pointer; width:100%; transition:transform .08s, box-shadow .08s; touch-action:manipulation}
.btn:active:not(:disabled){transform:translateY(3px); box-shadow:0 1px 0 var(--shadow)}
.btn:disabled{opacity:.42; cursor:not-allowed}
.btn.ok{background:var(--ok)}
.btn.warn{background:var(--margem)}
.btn.ghost{background:transparent; color:var(--text); border:2px solid var(--line); box-shadow:none; font-weight:600}
.btn.ghost.warnline{border-color:var(--margem); color:var(--margem)}
.btn.sm{width:auto; min-height:48px; font-size:16px; padding:8px 14px; box-shadow:0 3px 0 var(--shadow)}
.btn.huge{min-height:84px; font-size:28px; border-radius:20px}
.link{font:inherit; font-weight:600; background:none; border:0; color:var(--text); text-decoration:underline; text-underline-offset:3px; padding:10px 4px; cursor:pointer; min-height:44px}
.link.danger{color:var(--margem)}
.stack{display:flex; flex-direction:column; gap:12px; width:100%}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.row3{display:flex; gap:8px}
.row3 .btn{font-size:15px; padding:10px 8px; min-height:52px}

/* fita washi */
.tape{display:inline-block; font-family:'Caveat', 'Comic Sans MS', cursive; font-weight:700; font-size:26px; line-height:1.15;
  color:var(--tinta); background:var(--c,#FFC145); padding:2px 16px 0; transform:rotate(-2deg);
  clip-path:polygon(0 12%,4% 0,96% 0,100% 14%,97% 50%,100% 86%,96% 100%,4% 100%,0 88%,3% 50%)}
.tape.sm{font-size:21px; padding:1px 12px 0}
.tape.lg{font-size:38px; padding:2px 22px 0}

/* papel */
.slip{background:var(--paper-bg); color:var(--paper-ink); border-radius:6px; box-shadow:0 14px 28px rgba(8,12,30,.28);
  font-family:'Caveat','Comic Sans MS',cursive; font-weight:700}

/* home */
.home{display:flex; flex-direction:column; align-items:center; text-align:center; gap:16px; flex:1; justify-content:center}
.logo{font-size:clamp(40px,13vw,70px); font-weight:800; display:flex; gap:.06em; margin-top:8px}
.logo span{display:inline-grid; place-items:center; width:1.02em; height:1.12em; background:var(--papel); color:var(--tinta);
  border-radius:5px; transform:rotate(var(--r)); box-shadow:0 6px 0 rgba(8,12,30,.18); position:relative}
.logo span::before{content:''; position:absolute; top:-.1em; left:28%; width:44%; height:.2em; background:var(--c); opacity:.92; transform:rotate(-5deg)}
.tagline{font-size:19px; color:var(--muted); max-width:28ch}
.hero{margin:6px 0 4px}
.rules{text-align:left; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px 18px 16px 38px; margin:0; width:100%}
.rules li{margin:6px 0}

/* balde */
.bucket{display:block; transform-origin:50% 100%}
.bucket-lg{width:180px}
.bucket-md{width:120px}
.bucket-sm{width:52px}
.bucket-wrap{position:relative; display:inline-block}
.count{position:absolute; right:-10px; top:46%; background:var(--margem); color:#fff; font-weight:800; font-size:17px;
  border-radius:999px; min-width:38px; height:38px; padding:0 8px; display:grid; place-items:center; box-shadow:0 3px 0 rgba(8,12,30,.25)}

/* balde 3D */
.b3d-wrap{position:relative; width:100%; display:flex; justify-content:center}
.b3d{width:100%; display:grid; place-items:center}
.b3d-hero{height:300px}
.b3d-lg{height:280px}
.b3d-md{height:220px}
.b3d canvas{width:100%; height:100%; display:block; touch-action:pan-y; cursor:grab;
  -webkit-mask-image:radial-gradient(ellipse 62% 58% at 50% 52%, #000 62%, transparent 100%); mask-image:radial-gradient(ellipse 62% 58% at 50% 52%, #000 62%, transparent 100%)}
.b3d-wrap .count{right:10%; top:14%}
.hint{font-size:14px; color:var(--muted)}
.plus{position:fixed; z-index:61; font-weight:800; font-size:34px; color:var(--ok); text-shadow:0 2px 0 rgba(8,12,30,.25)}

.paper-postit .turn .slip.big{background:linear-gradient(180deg, rgba(0,0,0,.07), rgba(0,0,0,0) 22%, rgba(0,0,0,.05)), var(--c)}
.b3d-fit{height:320px}
.bucket-thumb{width:62px}

/* pausa */
.timer-row{display:flex; align-items:center; gap:10px; margin-right:52px; margin-top:6px}
.timer-row .timer{flex:1; margin:0}
.cl-turn .timer-row{margin-right:0}
.pause-btn{flex:none; width:44px; height:44px; border-radius:50%; border:2px solid var(--line); background:var(--card); color:var(--text); display:grid; place-items:center; cursor:pointer}
.pause-btn:disabled{opacity:.4}

/* sala */
.room-code{font-size:clamp(52px,16vw,72px); font-weight:800; letter-spacing:.12em; line-height:1; font-variant-numeric:tabular-nums}
.qr{width:184px; height:184px; border-radius:16px; background:#fff; padding:8px; display:grid; place-items:center; box-shadow:0 6px 16px rgba(8,12,30,.18)}
.qr svg{width:100%; height:100%; display:block}
.net-status{display:inline-flex; align-items:center; gap:8px; font-size:15px; color:var(--muted)}
.net-dot{width:10px; height:10px; border-radius:50%; background:var(--margem); flex:none}
.net-dot.on{background:var(--ok)}
.lobby-teams{display:flex; flex-direction:column; gap:10px; width:100%}
.lobby-team{display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line); border-left:8px solid var(--c); border-radius:14px; padding:10px 12px; text-align:left}
.lobby-team .tape{flex:none}
.lobby-team .st{flex:1; font-size:14px; color:var(--muted); line-height:1.3}
.lobby-team .st b{color:var(--text)}
.cl-bar{display:flex; align-items:center; justify-content:space-between; gap:8px}
.room-chip{display:inline-flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:8px 14px; font-size:15px}
.cl-lost{background:var(--margem); color:#fff; border-radius:10px; padding:8px 12px; font-weight:600; text-align:center}
.team-pick{display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%; background:var(--card); border:1px solid var(--line); border-left:8px solid var(--c); border-radius:14px; padding:14px; color:var(--text); font:inherit; cursor:pointer; text-align:left}
.team-pick:disabled{opacity:.5; cursor:not-allowed}
.code-input{font:inherit; font-size:40px; font-weight:800; letter-spacing:.2em; text-align:center; text-transform:uppercase; width:100%; min-height:72px; border-radius:16px; border:2px solid var(--line); background:var(--card); color:var(--text)}

/* conta */
.acct{display:inline-flex; align-items:center; gap:8px; min-height:44px; padding:5px 14px 5px 5px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--text); font:inherit; font-weight:600; cursor:pointer; max-width:62%}
.acct span:last-child{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.avatar{flex:none; width:34px; height:34px; border-radius:50%; display:grid; place-items:center; background:var(--ok); color:var(--tinta); font-weight:800}
.avatar.ghost{background:var(--bg); color:var(--text)}
.cloud-line{display:flex; align-items:center; gap:8px; font-size:15px; color:var(--muted); flex-wrap:wrap}
.cloud-line .link{padding:0; min-height:auto}
.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; text-align:center}
.stats div{background:var(--bg); border-radius:12px; padding:10px 4px}
.stats b{display:block; font-size:24px}

/* loja */
.topbar.spread{justify-content:space-between}
.wallet{display:inline-flex; align-items:center; gap:6px; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:6px 14px 6px 8px; font:inherit; font-weight:800; color:var(--text); cursor:pointer; min-height:44px}
.wallet small{font-weight:600; color:var(--muted)}
.coin{flex:none; display:inline-block; vertical-align:middle}
.home-top{width:100%; display:flex; justify-content:space-between; align-items:center; gap:8px}
.fit-cta{display:flex; align-items:center; gap:14px; width:100%; text-align:left; padding:14px 16px; border-radius:18px; border:2px solid var(--tinta); background:var(--papel); color:var(--tinta); box-shadow:0 4px 0 var(--shadow); font:inherit; cursor:pointer}
.fit-cta b{display:block; font-size:19px}
.fit-cta small{display:block; font-size:14px; opacity:.75; line-height:1.35}
.fit-cta-art{flex:none; width:64px; display:grid; place-items:center}
.tabs{display:flex; gap:6px; overflow-x:auto; scrollbar-width:none}
.tabs button{flex:1 1 auto; min-height:44px; padding:0 10px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--text); font:inherit; font-weight:600; white-space:nowrap; cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--papel); color:var(--tinta); border:2px solid var(--tinta)}
.grid{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.item{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px; display:flex; flex-direction:column; gap:6px}
.item.on{border:2px solid var(--ok)}
.item h4{margin:4px 0 0; font-size:17px; line-height:1.15}
.item .small{flex:1}
.thumb{height:100px; border-radius:12px; display:grid; place-items:center; background:var(--bg); overflow:hidden}
.item-cta{display:flex; align-items:center; justify-content:space-between; gap:6px; flex-wrap:wrap}
.item-cta .btn.sm{display:inline-flex; align-items:center; gap:4px; padding:8px 12px}
.badge{display:inline-block; padding:6px 12px; border-radius:999px; background:var(--ok); color:var(--tinta); font-weight:800; font-size:14px}
.tbl{display:block; width:78%; aspect-ratio:1; border-radius:50%; box-shadow:inset 0 0 0 1px rgba(0,0,0,.12), 0 6px 12px rgba(8,12,30,.18)}
.pp{display:grid; place-items:center; width:72%; height:58%; font-family:'Caveat','Comic Sans MS',cursive; font-weight:700; font-size:26px; border-radius:4px; transform:rotate(-3deg); box-shadow:0 4px 10px rgba(8,12,30,.2)}
.tp{display:flex; flex-direction:column; gap:4px; align-items:center}
.tp i{display:block; width:58px; height:9px; background:var(--c); transform:rotate(var(--r)); clip-path:polygon(0 15%,4% 0,96% 0,100% 18%,97% 50%,100% 85%,96% 100%,4% 100%,0 85%,3% 50%)}
.sw .tp i{width:44px; height:7px}
.fit-stage{border-radius:22px; overflow:hidden; background:radial-gradient(ellipse at 50% 60%, var(--card), transparent 70%)}
.fit-sample{display:flex; gap:10px; align-items:center; justify-content:center; flex-wrap:wrap}
.sample-slip{font-family:'Caveat','Comic Sans MS',cursive; font-weight:700; font-size:30px; padding:8px 18px 4px; border-radius:6px; transform:rotate(-2deg); box-shadow:0 6px 14px rgba(8,12,30,.22)}
.fit-row{display:flex; flex-direction:column; gap:6px}
.fit-row>span{font-weight:600}
.looks,.swatches{display:flex; gap:10px; overflow-x:auto; padding:4px 2px 8px; scrollbar-width:none; scroll-snap-type:x proximity}
.looks::-webkit-scrollbar,.swatches::-webkit-scrollbar,.tabs::-webkit-scrollbar{display:none}
.look{flex:none; min-height:44px; padding:8px 16px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--text); font:inherit; font-weight:600; cursor:pointer; scroll-snap-align:start}
.look[aria-pressed="true"]{background:var(--papel); color:var(--tinta); border:2px solid var(--tinta)}
.sw{flex:none; width:82px; display:flex; flex-direction:column; align-items:center; gap:4px; background:none; border:0; padding:4px 0 0; color:var(--text); font:inherit; font-size:13px; line-height:1.2; cursor:pointer; position:relative; scroll-snap-align:start}
.sw-img{width:74px; height:74px; border-radius:16px; display:grid; place-items:center; border:2px solid var(--line); overflow:hidden; background:var(--card)}
.sw-img .bucket-thumb{width:52px}
.sw-img .pp{font-size:20px}
.sw[aria-pressed="true"] .sw-img{border:3px solid var(--ok); box-shadow:0 0 0 3px rgba(46,196,182,.25)}
.sw .lock{position:absolute; top:0; right:0; display:inline-flex; align-items:center; gap:2px; background:var(--papel); color:var(--tinta); border-radius:999px; padding:1px 7px 1px 4px; font-size:12px; font-weight:800; box-shadow:0 2px 0 rgba(8,12,30,.2)}
.reward{display:inline-flex; align-items:center; gap:10px; padding:10px 18px; border-radius:16px; background:var(--papel); color:var(--tinta); font-size:18px; box-shadow:0 4px 0 var(--shadow)}

/* setup */
.screen{display:flex; flex-direction:column; gap:14px; flex:1}
.center{align-items:center; text-align:center; justify-content:center}
.topbar{display:flex; align-items:center; gap:10px; margin-bottom:4px}
.team{background:var(--card); border:1px solid var(--line); border-top:6px solid var(--c); border-radius:16px; padding:14px; display:flex; flex-direction:column; gap:12px}
.team-head{display:flex; align-items:center; justify-content:space-between; gap:8px}
.tape-input{font-family:'Caveat','Comic Sans MS',cursive; font-weight:700; font-size:27px; background:var(--c); color:var(--tinta);
  border:0; padding:2px 14px 0; width:62%; transform:rotate(-1.5deg); border-radius:0;
  clip-path:polygon(0 12%,3% 0,97% 0,100% 14%,98% 50%,100% 86%,97% 100%,3% 100%,0 88%,2% 50%)}
.chips{list-style:none; padding:0; margin:0; display:flex; flex-wrap:wrap; gap:8px}
.chip{display:inline-flex; align-items:center; gap:2px; padding:4px 4px 4px 14px; background:var(--bg); border-radius:999px; font-weight:600}
.chip button{width:34px; height:34px; border:0; border-radius:50%; background:transparent; color:var(--muted); font-size:22px; line-height:1; cursor:pointer}
.chip-empty{color:var(--muted); font-size:15px}
.add{display:flex; gap:8px}
.add input,.field input{flex:1; min-width:0; min-height:48px; padding:10px 14px; border-radius:12px; border:1px solid var(--line);
  background:var(--bg); color:var(--text); font:inherit; font-size:17px}
.field{display:flex; flex-direction:column; gap:8px; text-align:left}
.field>span{font-weight:600}
.seg{display:flex; gap:6px; flex-wrap:wrap}
.seg button{flex:1; min-width:54px; min-height:48px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--text); font:inherit; font-weight:600; cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--papel); color:var(--tinta); border:2px solid var(--tinta)}
.tog{display:flex; justify-content:space-between; align-items:center; gap:14px; width:100%; text-align:left; background:var(--card);
  border:1px solid var(--line); border-radius:14px; padding:14px; color:var(--text); font:inherit; cursor:pointer}
.tog b{font-weight:600}
.tog small{display:block; color:var(--muted); font-size:14px; margin-top:2px; line-height:1.35}
.switch{flex:none; width:50px; height:30px; border-radius:999px; background:var(--line); position:relative; transition:background .2s}
.switch::after{content:''; position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.25); transition:transform .2s}
.tog[aria-pressed="true"] .switch{background:var(--ok)}
.tog[aria-pressed="true"] .switch::after{transform:translateX(20px)}
.bio{background:var(--card); border:1px dashed var(--line); border-radius:14px; padding:14px; display:flex; flex-direction:column; gap:10px}
.sticky-cta{position:sticky; bottom:0; padding:16px 0 8px; background:linear-gradient(to bottom, transparent, var(--bg) 28%); display:flex; flex-direction:column; gap:8px}
.err{color:var(--margem); font-weight:600; font-size:15px}

/* escrita */
.pass-to{font-size:22px; font-weight:600}
.who{font-size:46px; font-weight:800; line-height:1; letter-spacing:-.02em; word-break:break-word}
.wslips{display:flex; flex-direction:column; gap:14px}
.wslip{display:block; transform-origin:50% 50%}
.wslip:nth-child(odd){transform:rotate(-1deg)}
.wslip:nth-child(even){transform:rotate(.8deg)}
.wslip input{width:100%; font-family:'Caveat','Comic Sans MS',cursive; font-weight:700; font-size:34px; color:var(--paper-ink);
  background:var(--paper-bg); border:0; border-radius:6px; padding:12px 14px 6px var(--paper-pad); min-height:72px; box-shadow:0 8px 18px rgba(8,12,30,.2)}
.wslip input::placeholder{color:#9AA6C6}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

/* ronda */
.round-n{font-weight:600; color:var(--muted)}
.round-title{font-size:clamp(56px,18vw,92px); font-weight:800; line-height:.9; letter-spacing:-.03em}
.round-rule{font-size:19px; max-width:30ch}
.order{list-style:none; display:flex; flex-wrap:wrap; justify-content:center; gap:10px 6px; padding:0; margin:0; counter-reset:o}
.order li{counter-increment:o; display:flex; align-items:center; gap:4px}
.order li::before{content:counter(o); font-weight:800; color:var(--muted); font-size:15px}
.draw{display:flex; flex-direction:column; align-items:center; gap:8px; padding:14px 18px; border:2px dashed var(--line); border-radius:18px; width:100%}
.note{background:var(--card); border-left:6px solid var(--c,#FFC145); border-radius:10px; padding:10px 14px; text-align:left}

/* pronto */
.clock{display:flex; align-items:baseline; gap:8px; justify-content:center}
.clock-n{font-size:60px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums}
.scores{display:flex; flex-wrap:wrap; gap:8px; justify-content:center}
.score{display:inline-flex; align-items:center; gap:8px; padding:5px 12px 5px 8px; border-radius:999px; background:var(--card); border:1px solid var(--line); font-weight:600}
.score::before{content:''; width:14px; height:14px; border-radius:50%; background:var(--c)}
.score.now{border:2px solid var(--c)}
.score-n{font-weight:800; font-variant-numeric:tabular-nums}

/* turno */
.turn{display:flex; flex-direction:column; gap:12px; flex:1; position:relative}
.timer{height:16px; border-radius:999px; background:var(--line); overflow:hidden; margin-right:52px; margin-top:12px}
.timer-fill{height:100%; width:100%; background:var(--c); border-radius:inherit; transition:width .12s linear}
.turn-top{display:flex; align-items:center; justify-content:space-between; gap:8px}
.tsec{font-size:46px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; min-width:2ch; text-align:center}
.turn.hurry .timer-fill{background:var(--margem)}
.turn.hurry .tsec{color:var(--margem)}
.pile{font-size:14px; color:var(--muted); text-align:right; line-height:1.2}
.pile b{display:block; font-size:28px; color:var(--text)}
.mode{text-align:center; color:var(--muted); font-weight:600}
.stage{flex:1; display:grid; place-items:center; min-height:230px; padding:6px 4px}
.slip.big{width:100%; min-height:220px; display:grid; place-items:center; padding:26px 20px 22px var(--paper-pad); transform:rotate(-1.5deg); text-align:center}
.slip-word{line-height:1.02; word-break:break-word; hyphens:auto}
.is-paused .stage{filter:blur(18px)}
.held{display:flex; align-items:center; gap:10px; width:100%; background:var(--card); border:2px dashed var(--line); border-radius:14px; padding:10px 14px; color:var(--text); font:inherit; cursor:pointer; text-align:left}
.held-label{font-size:13px; color:var(--muted); font-weight:600}
.held-word{font-family:'Caveat','Comic Sans MS',cursive; font-weight:700; font-size:26px; flex:1}
.held-cta{font-weight:800; text-decoration:underline}
.actions{display:flex; flex-direction:column; gap:10px}
.bucket-row{display:flex; align-items:center; justify-content:center; gap:10px; color:var(--muted); font-size:15px}
.pause{position:fixed; inset:0; background:rgba(15,21,44,.78); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); display:grid; place-items:center; z-index:20; padding:24px}
.pause-card{background:var(--card); color:var(--text); border-radius:20px; padding:26px 22px; width:min(360px,100%); display:flex; flex-direction:column; gap:14px; text-align:center}

/* fim de turno / ronda / final */
.big-title{font-size:clamp(48px,15vw,72px); font-weight:800; letter-spacing:-.03em; line-height:.95}
.mini-slips{display:flex; flex-wrap:wrap; gap:8px; justify-content:center}
.mini-slip{font-family:'Caveat','Comic Sans MS',cursive; font-weight:700; font-size:24px; background:var(--paper-bg); color:var(--paper-ink);
  padding:2px 12px; border-radius:4px; transform:rotate(var(--r,0deg)); box-shadow:0 3px 8px rgba(8,12,30,.18)}
.next{display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:center; font-weight:600}
.bars{display:flex; flex-direction:column; gap:10px; width:100%}
.bar-row{display:grid; grid-template-columns:minmax(70px,104px) 1fr 40px; align-items:center; gap:10px; text-align:left}
.bar-name{font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.bar{height:28px; background:var(--line); border-radius:6px; overflow:hidden}
.bar-fill{height:100%; background:var(--c); border-radius:6px}
.bar-n{font-weight:800; font-size:20px; text-align:right; font-variant-numeric:tabular-nums}
.rank{list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:10px; width:100%}
.rank li{display:flex; align-items:center; gap:12px; padding:12px 16px; background:var(--card); border-radius:14px; border-left:8px solid var(--c)}
.pos{font-size:26px; font-weight:800; width:28px; color:var(--muted)}
.rank li:first-child .pos{color:var(--text)}
.rank-n{margin-left:auto; font-size:30px; font-weight:800; font-variant-numeric:tabular-nums}
.table-wrap{overflow-x:auto; width:100%}
table{border-collapse:collapse; width:100%; font-size:15px}
th,td{padding:8px 6px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted); font-weight:600}

/* roda dentada + admin */
#lock{position:fixed; top:calc(env(safe-area-inset-top,0px) + 10px); right:12px; width:44px; height:44px; border-radius:50%;
  border:1px solid var(--line); background:var(--card); color:var(--text); display:grid; place-items:center; z-index:30; cursor:pointer}
#overlay{position:fixed; inset:0; z-index:50; background:rgba(8,12,30,.62); display:flex; align-items:flex-end; justify-content:center}
.sheet{background:var(--card); color:var(--text); width:100%; max-width:560px; max-height:92%; overflow:auto; border-radius:22px 22px 0 0;
  padding:20px 18px calc(26px + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; gap:12px}
.sheet section{display:flex; flex-direction:column; gap:10px; border-top:1px solid var(--line); padding-top:12px}
.sheet-head{display:flex; align-items:center; justify-content:space-between}
.sheet .tog,.sheet .seg button{background:var(--bg)}
.dots{display:flex; gap:14px; justify-content:center; margin:8px 0}
.dots span{width:16px; height:16px; border-radius:50%; border:2px solid var(--text)}
.dots span.on{background:var(--text)}
.pad{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.pad button{min-height:62px; border-radius:14px; border:1px solid var(--line); background:var(--bg); color:var(--text); font:inherit; font-size:26px; font-weight:600; cursor:pointer}
.pad .pad-alt{font-size:15px}
.adj{display:flex; align-items:center; gap:10px}
.adj .tape{margin-right:auto}
.adj b{font-size:24px; min-width:2ch; text-align:center; font-variant-numeric:tabular-nums}
.round-btn{width:48px; height:48px; border-radius:50%; border:2px solid var(--line); background:var(--bg); color:var(--text); font-size:24px; font-weight:800; cursor:pointer}
.log{margin:0; padding-left:0; list-style:none; font-size:14px; max-height:200px; overflow:auto; display:flex; flex-direction:column; gap:4px}
.log time{color:var(--muted); font-variant-numeric:tabular-nums; margin-right:6px}

/* efeitos */
#fx{position:fixed; inset:0; pointer-events:none; z-index:60; overflow:hidden}
.cd{position:fixed; inset:0; display:grid; place-items:center; font-size:170px; font-weight:800; color:var(--papel); background:rgba(15,21,44,.6); pointer-events:auto}
.conf{position:absolute; top:-24px; width:10px; height:16px; border-radius:2px}
.toast{position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom,0px) + 24px); transform:translateX(-50%); background:var(--papel); color:var(--tinta);
  padding:10px 18px; border-radius:12px; font-weight:600; box-shadow:0 8px 20px rgba(8,12,30,.3); animation:toast 2.2s ease forwards}
/* promoção e café */
.was{text-decoration:line-through; opacity:.6; font-weight:600; margin-right:5px}
.free{font-weight:800}
.lock .was{margin-right:3px}
.promo{background:var(--ok); color:var(--tinta); border-radius:12px; padding:10px 14px}
.btn.coffee{display:flex; align-items:center; justify-content:center; gap:10px; text-decoration:none}
.coffee-card{background:var(--card); border:1px dashed var(--line); border-radius:14px; padding:14px; display:flex; flex-direction:column; gap:10px}
.coffee-card .btn{background:#FFC145}
.coffee-card a:not(.btn){color:var(--text); font-weight:600; text-underline-offset:3px}
/* indicador de scroll */
#more{position:fixed; left:0; right:0; bottom:var(--more-b,0px); height:calc(88px + env(safe-area-inset-bottom,0px)); z-index:15; pointer-events:none;
  display:flex; align-items:flex-end; justify-content:center; padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  background:linear-gradient(to bottom, transparent, var(--bg) 85%); opacity:0; visibility:hidden; transition:opacity .2s ease, visibility 0s linear .2s}
#more.on{opacity:1; visibility:visible; transition:opacity .2s ease}
#more button{pointer-events:auto; display:inline-flex; align-items:center; gap:6px; min-height:44px; padding:8px 18px 8px 20px; border-radius:999px;
  border:2px solid var(--tinta); background:var(--papel); color:var(--tinta); font:inherit; font-weight:800; font-size:16px; box-shadow:0 3px 0 var(--shadow); cursor:pointer; animation:more-bob 1.4s ease-in-out infinite}
#more button svg{display:block}
@keyframes more-bob{0%,100%{transform:translateY(0)} 50%{transform:translateY(5px)}}
@keyframes toast{0%{opacity:0; transform:translate(-50%,12px)} 12%,80%{opacity:1; transform:translate(-50%,0)} 100%{opacity:0}}
@keyframes shake{0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)}}
.shake{animation:shake .3s 2}
@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important} }
</style>
</head>

<script>
(function(){
'use strict';
/* ---------- constantes ---------- */
const COLORS=[['Coral','#FF6F59'],['Girassol','#FFC145'],['Turquesa','#2EC4B6'],['Lavanda','#7B9CFF'],['Magenta','#E86BD0'],['Lima','#9BE564']];

const LOGO_ROT=[-6,4,-3,7,-5,3];

  const n=t.players.length; let b, tries=0;
  do{
    b=Array.from({length:n},(_,i)=>i);
    for(let i=n-1;i>0;i--){ const j=randInt(i+1); const x=b[i]; b[i]=b[j]; b[j]=x; }
    if(n>1&&b[0]===last){ const j=1+randInt(n-1); const x=b[0]; b[0]=b[j]; b[j]=x; }
    tries++;

}

class FakeEm{ constructor(){ this._h={}; } on(e,f){ (this._h[e]=this._h[e]||[]).push(f); return this; } once(e,f){ const g=(...a)=>{ this.off(e,g); f(...a); }; return this.on(e,g); } off(e,f){ this._h[e]=(this._h[e]||[]).filter(x=>x!==f); } emit(e,...a){ (this._h[e]||[]).slice().forEach(f=>f(...a)); } }

  close(){ this._p._post({k:'close',to:this.peer,from:this._p.id,cid:this.cid}); this.open=false; this.emit('close'); } }

    else if(m.k==='data'){ const c=this.conns[m.cid]; if(c) c.emit('data',m.d); }
    else if(m.k==='close'){ const c=this.conns[m.cid]; if(c){ c.open=false; delete this.conns[m.cid]; c.emit('close'); } } }

const NET=(function(){
  const PREFIX='bucketofwords-v1-', LOCAL=/[?&]rede=local/.test(location.search);
  let peer=null, hostConn=null, conns=new Map(), cb={}, retryT=null, mode=null, code=null, alive=false, P=null;
  const lib=()=>LOCAL?Promise.resolve(FakePeer):window.Peer?Promise.resolve(window.Peer):loadScript(PEER_URL).then(()=>window.Peer);
  function hostOpen(c,h){ close(); mode='host'; code=c; cb=h; alive=true; lib().then(L=>{ P=L; mkHost(); }).catch(()=>cb.status('error')); }
  function mkHost(){
    if(!alive) return; try{ if(peer) peer.destroy(); }catch(e){} cb.status('retry');
    peer=new P(PREFIX+code,{debug:0});
    peer.on('open',()=>cb.status('open'));
    peer.on('connection',conn=>{
      conn.on('open',()=>{ conns.set(conn.peer,conn); });
      conn.on('data',d=>cb.msg(conn,d));
      conn.on('close',()=>{ if(conns.get(conn.peer)===conn) conns.delete(conn.peer); cb.close(conn); });
      conn.on('error',()=>{});
    });
    peer.on('disconnected',()=>{ if(!alive) return; cb.status('reconnecting'); try{ peer.reconnect(); }catch(e){} });
    peer.on('error',e=>{ if(!alive) return; if(e.type==='peer-unavailable') return; cb.status(e.type==='browser-incompatible'?'error':'retry'); clearTimeout(retryT); retryT=setTimeout(mkHost,4000); });
  }
  function joinOpen(c,h){ close(); mode='client'; code=c; cb=h; alive=true; lib().then(L=>{ P=L; mkClient(); }).catch(()=>cb.status('error')); }
  function mkClient(){
    if(!alive) return;
    if(!peer||peer.destroyed){
      peer=new P(undefined,{debug:0});
      peer.on('error',e=>{ if(!alive) return; cb.status(e.type==='peer-unavailable'?'nohost':'lost'); again(); });
      peer.on('disconnected',()=>{ try{ peer.reconnect(); }catch(e){} });
    }
    const go=()=>{ if(!alive) return;
      const c=peer.connect(PREFIX+code,{reliable:true}); hostConn=c;
      c.on('open',()=>{ if(hostConn===c) cb.status('open'); });
      c.on('data',d=>{ if(hostConn===c) cb.msg(c,d); });

})();

function viewFor(ti){
  const ph=S.phase==='words'?'lobby':S.phase, r=Math.min(S.round,ROUNDS.length-1), L=S.lobby;
  const v={t:'view', phase:ph, myTeam:ti, round:r, roundName:ROUNDS[r].name, rule:ROUNDS[r].rule, nRounds:ROUNDS.length, bucket:S.bucket.length,
    teams:S.teams.map(t=>({name:t.name, color:t.color, total:total(t)})), order:S.order.slice(), players:S.teams[ti].players.slice(), wpp:S.settings.wordsPerPlayer,

function onHostMsg(conn,m){
  if(!S||S.mode!=='lobby'||!S.lobby||!m||typeof m!=='object') return;
  const L=S.lobby;
  if(m.t==='hello'){ conn._dev=String(m.device||'').slice(0,40); const ti=Object.keys(L.devices).find(k=>L.devices[k]===conn._dev);
    if(ti!=null){ conn._team=+ti; HOSTNET.byDev.set(conn._dev,conn); softRender(); } else sendTeams(conn); return; }
  const dev=conn._dev; if(!dev) return;
  if(m.t==='claim'){ const ti=+m.team, owner=L.devices[ti]; if(!S.teams[ti]) return;
    if(owner&&owner!==dev&&HOSTNET.byDev.has(owner)){ NET.send(conn,{t:'claimFail'}); sendTeams(conn); return; }
    Object.keys(L.devices).forEach(k=>{ if(L.devices[k]===dev) delete L.devices[k]; });
    L.devices[ti]=dev; conn._team=ti; HOSTNET.byDev.set(dev,conn); log(`${S.teams[ti].name} ligou um telemóvel`); save(); softRender(); return; }

  if(m.t==='act'){ if(S.phase==='turn'&&S.turn) remoteAct(String(m.kind),ti); return; }
  if(m.t==='leave'){ delete L.devices[ti]; HOSTNET.byDev.delete(dev); conn._team=null; save(); softRender(); }
}

function hostWords(ti,m){

  if(!words.length) return;
  commit(`${team.name}: ${team.players[idx]} pôs ${words.length} papelinhos no balde`,()=>{
    words.forEach(w=>{ const id='s'+(S.slips.length+1); S.slips.push({id,text:w,author:team.players[idx]}); S.bucket.push(id); });
    L.recv[ti].push(idx); if(L.recv[ti].length>=team.players.length) L.done[ti]=true; });

}

/* ---------- conta Google (Firebase) ---------- */
const CLOUD=(function(){
  const CFG=window.FIREBASE_CONFIG||null, V='10.12.2', BASE='https://www.gstatic.com/firebasejs/'+V+'/';
  let auth=null, db=null, user=null, unsub=null, timer=null, state=CFG?'loading':'off';
  const load=src=>new Promise((res,rej)=>{ const sc=document.createElement('script'); sc.src=src; sc.onload=res; sc.onerror=rej; document.head.appendChild(sc); });
  const idOf=u=>(u&&u.email||'').trim().toLowerCase();
  const ref=()=>db.collection('players').doc(idOf(user));
  const clean=()=>({awarded:PROF.awarded, bonus:PROF.bonus, owned:PROF.owned, eq:PROF.eq, eqAt:PROF.eqAt});
  function changed(){ if(UI.overlay==='account') renderOverlay(); if(UI.home||UI.screen||!S) render(); }
  async function init(){
    if(!CFG) return;
    try{
      await load(BASE+'firebase-app-compat.js');
      await Promise.all([load(BASE+'firebase-auth-compat.js'),load(BASE+'firebase-firestore-compat.js')]);
      firebase.initializeApp(CFG); auth=firebase.auth(); db=firebase.firestore();
      try{ await auth.getRedirectResult(); }catch(e){}
      auth.onAuthStateChanged(onUser);
    }catch(e){ state='error'; UI.cloudMsg='Não foi possível ligar ao serviço de contas. O progresso continua guardado neste telemóvel.'; changed(); }
  }
  async function onUser(u){
    if(unsub){ unsub(); unsub=null; }
    user=u; if(!u){ state='out'; changed(); return; }
    if(!idOf(u)){ state='error'; UI.cloudMsg='Esta conta não tem email associado e não pode guardar progresso.'; changed(); return; }
    state='syncing'; changed();
    try{
      const snap=await ref().get(), remote=snap.exists?(snap.data().profile||null):null;
      if(PROF.acct&&PROF.acct!==idOf(u)) PROF=normProf(remote);
      else PROF=mergeProf(PROF,remote);
      PROF.acct=idOf(u); saveProfLocal(); applyLook(); await push();
      unsub=ref().onSnapshot(sn=>{
        if(sn.metadata.hasPendingWrites||!sn.exists) return;
        const m=mergeProf(PROF,sn.data().profile); m.acct=PROF.acct;
        if(JSON.stringify(m)!==JSON.stringify(PROF)){ PROF=m; saveProfLocal(); applyLook(); changed(); }
      });
    }catch(e){ state='error'; UI.cloudMsg='Erro a sincronizar. O progresso continua guardado neste telemóvel e é enviado quando a ligação voltar.'; }
    changed();
  }
  function push(){
    if(!user) return Promise.resolve();
    return ref().set({profile:clean(), email:idOf(user), uid:user.uid, name:user.displayName||'', updatedAt:firebase.firestore.FieldValue.serverTimestamp()})
      .then(()=>{ state='saved'; UI.cloudMsg=''; changed(); })
      .catch(()=>{ state='error'; UI.cloudMsg='Não foi possível guardar na conta. Vou tentar outra vez na próxima alteração.'; changed(); });
  }
  function schedule(){ if(!user) return; state='syncing'; clearTimeout(timer); timer=setTimeout(push,800); }
  async function signIn(){
    if(!auth){ UI.cloudMsg='O serviço de contas ainda está a carregar.'; changed(); return; }
    const pv=new firebase.auth.GoogleAuthProvider(); pv.setCustomParameters({prompt:'select_account'});
    try{ await auth.signInWithPopup(pv); }
    catch(e){
      if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment'){ try{ await auth.signInWithRedirect(pv); }catch(e2){} }
      else if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request'){ UI.cloudMsg='Não foi possível entrar com Google ('+e.code+').'; changed(); }
    }
  }
  async function signOut(){ if(auth) await auth.signOut(); }
  async function wipe(){ if(!user) return; try{ await ref().delete(); }catch(e){} PROF.acct=null; saveProfLocal(); await signOut(); toast('Dados da conta apagados'); }
  return {init, schedule, signIn, signOut, wipe, enabled:()=>!!CFG, get user(){ return user; }, get state(){ return state; }};
})();

function award(){
  if(!S.gameId) S.gameId='g'+Date.now().toString(36);

  if(S.slips.length<8) S.award={ok:false, reason:'Este jogo teve menos de 8 papelinhos e não conta para a loja.'};

  else{ PROF.awarded.push(S.gameId); saveProf(); S.award={ok:true, fresh:true}; }
}

/* ---------- lógica de jogo ---------- */
function startGame(){
  const n=S.teams.length, st=randInt(n);
  S.order=Array.from({length:n},(_,k)=>(st+k)%n);
  S.teams.forEach(t=>{ t.lastP=null; refillBag(t,null); });
  S.turnPtr=0; S.round=0; S.phase='roundIntro'; S.introDraw=true; S.gameId='g'+Date.now().toString(36)+randInt(1e6); S.startedAt=Date.now(); S.award=null;
  log(`Sorteio: ${S.teams[st].name} começa`);
}
function endTurn(reason){
  const T=S.turn;
  if(T.current) S.bucket.push(T.current);
  if(T.held) S.bucket.push(T.held);
  const t=curTeam();
  S.last={ti:curTeamIdx(), player:curPlayer(), guessed:T.guessed.slice(), reason, backCurrent:!!T.current, backHeld:!!T.held};
  UI.drop=(T.current?1:0)+(T.held?1:0);
  advancePlayer(t); S.turnPtr++; S.turn=null; S.phase='turnEnd';
}
function endRound(){
  const left=msLeft(), ti=curTeamIdx(), t=curTeam();
  S.last={ti, player:curPlayer(), guessed:S.turn.guessed.slice(), reason:'empty'};
  if(S.settings.carryOver&&left>=5000&&S.round<ROUNDS.length-1){ S.carry={ti, ms:Math.round(left)}; }
  else { S.carry=null; advancePlayer(t); S.turnPtr++; }
  S.turn=null; S.phase='roundEnd';
  log(`Fim da ronda ${S.round+1}`);
}
function doGuess(){
  const T=S.turn; curTeam().scores[S.round]++; T.guessed.push(T.current); T.current=null;
  if(S.bucket.length) T.current=draw();
  else if(T.held){ T.current=T.held; T.held=null; }
  else endRound();
}
function startTurnCore(remote){
  commit(`Turno de ${curTeam().name} (${curPlayer()})`,()=>{
    const ti=curTeamIdx(); const ms=(S.carry&&S.carry.ti===ti)?S.carry.ms:S.settings.turnSeconds*1000; S.carry=null;
    S.turn={current:draw(), held:null, guessed:[], total:ms, msLeft:ms, endAt:Date.now()+ms, paused:false, remote:!!remote}; S.phase='turn';
  });
  lastBeep=null; UI.fx='draw'; if(remote) UI.liftOne=true; render(); window.scrollTo(0,0);
}
function hostAlarm(){ if(S&&S.mode==='lobby') NET.conns().forEach(c=>NET.send(c,{t:'alarm'})); }
function pauseGame(who){ if(S.phase!=='turn'||!S.turn||S.turn.paused) return; pauseTurn(); alarm(); hostAlarm(); log(`Jogo pausado (${who})`); save(); }
function remoteAct(kind,fromTi){
  const T=S.turn; if(!T) return;
  if(kind==='pause'){ pauseGame(S.teams[fromTi]?S.teams[fromTi].name:'equipa'); return; }
  if(kind==='resume'){ if(T.paused&&T.remote&&fromTi===curTeamIdx()) resumeTurn(); return; }
  if(!T.remote||fromTi!==curTeamIdx()) return;
  const t=curTeam(); if(T.paused) return;
  if(kind==='guess'){ commit(`${t.name} acertou (${curPlayer()})`,doGuess); beep(1180,.06); if(S.phase==='turn'){ UI.liftOne=true; UI.plus=true; } else UI.fx='celebrate'; }
  else if(kind==='hold'){ if(!S.settings.allowHold||T.held||!S.bucket.length) return; commit('Papelinho posto em espera',()=>{ T.held=T.current; T.current=draw(); }); UI.liftOne=true; }
  else if(kind==='swap'){ if(!T.held) return; commit('Troca com o papelinho em espera',()=>{ const c=T.current; T.current=T.held; T.held=c; }); }
  else if(kind==='undo'){ if(!T.guessed.length) return; commit(`Acerto anulado (${t.name})`,()=>{ const id=T.guessed.pop(); curTeam().scores[S.round]--; S.bucket.push(id); if(T.current) S.bucket.push(T.current); T.current=draw(); }); UI.liftOne=true; }
  else if(kind==='foul'){ beep(220,.35); commit(`Falta (${t.name})`,()=>endTurn('foul')); UI.fx='enter'; }
  else return;
  render();
}
function pauseTurn(){ if(S.phase!=='turn'||S.turn.paused) return; S.turn.msLeft=msLeft(); S.turn.paused=true; S.turn.endAt=null; save(); render(); }
function resumeTurn(){ if(S.phase!=='turn') return; S.turn.paused=false; S.turn.endAt=Date.now()+S.turn.msLeft; lastBeep=null; save(); render(); }
function timeUp(){
  beep(330,.6); vib([200,80,300]);
  commit(`Tempo esgotado (${curTeam().name})`,()=>endTurn('time'));
  UI.fx='enter'; render(); window.scrollTo(0,0);
}
function cacheTimer(){ tEls={fill:$('#tfill'), sec:$('#tsec'), root:document.querySelector('.turn')}; }
function tick(){
  raf=null;
  if(UI.home||!S||S.phase!=='turn'||!S.turn||S.turn.paused) return;
  const left=Math.max(0,S.turn.endAt-Date.now()), sec=Math.ceil(left/1000);
  if(tEls.fill) tEls.fill.style.width=(left/S.turn.total*100)+'%';
  if(tEls.sec&&tEls.sec.textContent!==String(sec)) tEls.sec.textContent=sec;
  if(tEls.root) tEls.root.classList.toggle('hurry',sec<=10);
  if(sec<=5&&sec>0&&sec!==lastBeep){ lastBeep=sec; beep(880,.09); }
  if(Date.now()-lastSave>1500){ S.turn.msLeft=left; save(); lastSave=Date.now(); if(S.mode==='lobby') hostBroadcastSoon(); }
  if(left<=0&&!busy){ lastBeep=null; timeUp(); return; }
  raf=requestAnimationFrame(tick);
}
function startTick(){ if(!raf) raf=requestAnimationFrame(tick); }

function countdown(cb){
  if(!HAS_ANIME()){ cb(); return; }
  const el=document.createElement('div'); el.className='cd'; $('#fx').appendChild(el);
  let n=3;
  const step=()=>{
    if(n===0){ el.remove(); cb(); return; }
    el.textContent=n; beep(n===1?990:660,.08);
    anime({targets:el, keyframes:[{scale:[2.2,1], opacity:[0,1], duration:260, easing:'easeOutBack'},{opacity:.15, duration:300, delay:80, easing:'linear'}]});
    n--; setTimeout(step,680);
  };
  step();
}

function addPlayer(i){
  const inp=document.querySelector(`[data-padd="${i}"]`); if(!inp) return;
  const v=inp.value.trim().replace(/\s+/g,' ').slice(0,20);
  if(!v){ inp.focus(); return; }
  S.teams[i].players.push(v); save(); render();
  const nx=document.querySelector(`[data-padd="${i}"]`); if(nx) nx.focus();
}
async function startWords(){
  if(setupErrors().length) return;
  if(UI.pin){ ADMIN.pinHash=await sha(UI.pin); store.set(AKEY,ADMIN); UI.pin=''; }
  S.teams.forEach((t,i)=>{ if(!t.name.trim()) t.name=(COLORS[t.ci]||COLORS[i%6])[0]; });
  S.wordIdx=0; S.wordStage='pass'; S.slips=[]; S.bucket=[]; S.writeList=null;
  if(S.mode==='lobby'){ S.phase='lobby'; S.lobby={code:genCode(), devices:{}, done:{}, recv:{}}; } else S.phase='words';
  HIST=[]; LOG=[]; log(S.mode==='lobby'?`Sala ${S.lobby.code} criada`:'Jogo criado'); save(); render(); window.scrollTo(0,0);
}
function submitWords(){
  if(busy) return;
  const inputs=Array.from(document.querySelectorAll('[data-w]'));
  const words=inputs.map(i=>i.value.trim().replace(/\s+/g,' '));
  if(words.some(w=>!w)) return;
  const existing=new Set(S.slips.map(s=>s.text.toLowerCase()));
  const dup=words.some((w,i)=>existing.has(w.toLowerCase())||words.findIndex(x=>x.toLowerCase()===w.toLowerCase())!==i);
  if(dup&&!UI.dupOk){ UI.dupOk=true; const e=$('#werr'); e.textContent='Uma destas palavras já está no balde. Muda-a, ou toca outra vez para manter.'; e.hidden=false; return; }
  busy=true; if(document.activeElement) document.activeElement.blur();
  const p=wlist()[S.wordIdx];
  const done=()=>{
    busy=false;
    commit(`${p.name} pôs ${words.length} papelinhos no balde`,()=>{
      words.forEach(w=>{ const id='s'+(S.slips.length+1); S.slips.push({id,text:w,author:p.name}); S.bucket.push(id); });
      S.wordIdx++; S.wordStage='pass'; UI.dupOk=false;
      if(S.mode==='lobby'){ const L=S.lobby; L.recv[p.ti]=L.recv[p.ti]||[]; if(!L.recv[p.ti].includes(p.pi)) L.recv[p.ti].push(p.pi); if(L.recv[p.ti].length>=S.teams[p.ti].players.length) L.done[p.ti]=true; }
      if(S.wordIdx>=wlist().length){ if(S.mode==='lobby'){ S.writeList=null; S.phase='lobby'; } else startGame(); }
    });

/* ---------- indicador de scroll ---------- */
const MORE=(function(){
  const el=$('#more'); let pend=false, on=false, want=false, tm=null;
  function set(v){ on=v; el.classList.toggle('on',v); }
  function run(){
    pend=false;
    const d=document.documentElement, app=$('#app'), padB=parseFloat(getComputedStyle(app).paddingBottom)||0, below=app.getBoundingClientRect().bottom-padB-d.clientHeight; /* só conta conteúdo, não a margem final */
    const ov=($('#overlay')&&!$('#overlay').hidden)||document.querySelector('.pause,.cd');
    const cta=document.querySelector('.sticky-cta');
    el.style.setProperty('--more-b',cta?cta.offsetHeight+'px':'0px');
    if(ov){ want=false; if(tm){ clearTimeout(tm); tm=null; } if(on) set(false); return; }
    if(below>40) want=true; else if(below<16) want=false;
    if(want===on){ if(tm){ clearTimeout(tm); tm=null; } return; }
    if(!tm) tm=setTimeout(()=>{ tm=null; if(want!==on) set(want); },140);
  }
  function upd(){ if(!pend){ pend=true; requestAnimationFrame(run); } }
  window.addEventListener('scroll',upd,{passive:true});
  window.addEventListener('resize',upd);
  if(typeof ResizeObserver==='function'){ const ro=new ResizeObserver(upd); ro.observe($('#app')); ro.observe(document.body); }
  return {upd};
})();

function render(){
  syncTeams();
  const keep={}; document.querySelectorAll('[data-scroll]').forEach(el=>{ keep[el.dataset.scroll]=el.scrollLeft; });
  const app=$('#app'); let html;
  if(UI.cl) html=vClient();
  else if(UI.screen==='join') html=vJoin();
  else if(UI.screen==='shop') html=vShop();
  else if(UI.screen==='fitting') html=vFitting();
  else if(UI.home||!S) html=vHome();
  else html=({setup:vSetup, lobby:vLobby, words:vWords, roundIntro:vRoundIntro, turnReady:vTurnReady, turn:()=>S.turn&&S.turn.remote?vTurnSpect():vTurn(), turnEnd:vTurnEnd, roundEnd:vRoundEnd, final:vFinal})[S.phase]();
  app.innerHTML=html;
  document.querySelectorAll('[data-scroll]').forEach(el=>{ if(keep[el.dataset.scroll]) el.scrollLeft=keep[el.dataset.scroll]; });
  const inGame=!!(S&&!UI.cl&&!UI.home&&!UI.screen&&S.phase!=='setup');
  $('#lock').hidden=!inGame;
  document.body.classList.toggle('lockon',inGame);
  document.body.classList.toggle('inturn',inGame&&S.phase==='turn');
  MORE.upd();
  after();
}
function after(){
  if(S&&S.mode==='lobby'&&S.lobby&&S.phase!=='setup'&&!UI.cl){ hostEnsure(); hostBroadcastSoon(); }
  if(UI.cl){ afterClient(); return; }
  const fx=UI.fx; UI.fx=null;
  if((UI.home||!S)&&!UI.screen&&!UI.logoDone) UI.drop=24;
  const b3=$('#b3d');
  if(b3){
    const target=+b3.dataset.count, k=Math.min(UI.drop||0,target), lf=UI.liftOne?1:0; UI.liftOne=false;
    if(B3D.mount(b3,target-k+lf,UI.screen==='fitting'?UI.preview:PROF.eq)){
      if(k){ const bc=$('#bcount'); if(bc) bc.textContent=target-k; B3D.drop(k,j=>{ const c=$('#bcount'); if(c) c.textContent=target-k+j+1; }); }
      if(lf) B3D.lift();
    } else if(k) shakeBucket();
  }
  UI.drop=0;
  if(UI.screen){ if(fx==='bought') popWallet(); return; }
  if(UI.home||!S){ animLogo(); return; }
  if(S.phase!=='turn') wake(false);
  switch(S.phase){
    case 'lobby': renderQR(); break;
    case 'turn': cacheTimer(); if(!S.turn.paused){ startTick(); wake(true); } if(fx==='draw') animDraw(); if(UI.plus){ UI.plus=false; plusOne(); } break;
    case 'words': if(S.wordStage==='write'){ const f=document.querySelector('[data-w="0"]'); if(f&&fx==='focus') f.focus(); } break;
    case 'roundIntro': if(S.introDraw) animDrawTeam(); if(fx){ A({targets:'#rtitle', scale:[.6,1], opacity:[0,1], duration:700, easing:'easeOutElastic(1, .6)'}); shakeBucket(); } break;
    case 'roundEnd': if(fx==='celebrate'){ animBars(); confetti(40); setTimeout(()=>B3D.wobble(.09),300); } break;
    case 'turnEnd': if(fx) A({targets:'#backnote', translateY:[18,0], opacity:[0,1], delay:450, duration:450, easing:'easeOutQuad'}); break;
    case 'final': if(fx==='celebrate'){ if(S.award&&S.award.fresh){ A({targets:'#reward', scale:[0,1], rotate:[-12,0], delay:900, duration:900, easing:'easeOutElastic(1, .5)'}); S.award.fresh=false; save(); } A({targets:'.rank li', translateX:[-40,0], opacity:[0,1], delay:ST(150), duration:600, easing:'easeOutBack'}); confetti(120); beep(660,.12); setTimeout(()=>beep(990,.25),140); } break;
  }
}
